name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate public skill package
        run: npm test

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the candidate skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Certify against production
        env:
          STORYLOOP_MCP_RESOURCE: ${{ vars.STORYLOOP_MCP_RESOURCE }}
        run: npm run certify
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [skill, compatibility]
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node --print "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StoryLoop skill $TAG" \
            --generate-notes
